# =============================================================================
# Nexus OMS & Supply Chain Platform — Production Docker Compose
# =============================================================================
# Brings up the FULL Nexus stack on a new machine:
#   postgres, redis, kafka, backend, frontend, ai-ops, ai-intel,
#   prometheus, grafana
#
# Usage:
#   cp .env.example .env   # then edit .env with real secrets
#   docker compose up -d --build
#
# All secrets come from .env (gitignored). No secrets are hardcoded here.
# =============================================================================

name: nexus

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL (pgvector) — primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: nexus_oms
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_oms"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Redis — cache & sessions
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Kafka — event streaming / order lifecycle
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.2
    container_name: nexus-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Backend — Spring Boot OMS API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    ports:
      - "8080:8080"
    environment:
      # Database
      NEXUS_DB_URL: jdbc:postgresql://postgres:5432/nexus_oms
      NEXUS_DB_USERNAME: nexus
      NEXUS_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
      # Redis
      NEXUS_REDIS_HOST: redis
      NEXUS_REDIS_PORT: 6379
      # Kafka
      NEXUS_KAFKA_BOOTSTRAP: kafka:9092
      NEXUS_KAFKA_ENABLED: "true"
      NEXUS_KAFKA_LISTENER_AUTO_START: ${NEXUS_KAFKA_LISTENER_AUTO_START:-true}
      # JWT
      NEXUS_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
      NEXUS_JWT_EXPIRATION_MS: ${NEXUS_JWT_EXPIRATION_MS:-900000}
      # Spring profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # CORS / frontend
      NEXUS_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173}
      NEXUS_FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # AI
      NEXUS_AI_ENABLED: ${NEXUS_AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      NEXUS_AI_BASE_URL_OPS: http://ai-ops:5000
      NEXUS_AI_BASE_URL_INTEL: http://ai-intel:5001
      # Cache
      NEXUS_CACHE_ENABLED: ${NEXUS_CACHE_ENABLED:-true}
      # S3 — StorageService requires the AmazonS3 bean; the app enables S3 by
      # default (storage.s3.enabled matchIfMissing=true), so keep this true.
      NEXUS_S3_ENABLED: ${NEXUS_S3_ENABLED:-true}
      NEXUS_S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
      NEXUS_S3_REGION: ${S3_REGION:-us-east-1}
      NEXUS_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      NEXUS_S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      NEXUS_S3_BUCKET: ${S3_BUCKET:-nexus-shipping-labels}
      # Logging
      NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Frontend — React SPA served by nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # AI Ops — Python order-routing ML service
  # ---------------------------------------------------------------------------
  ai-ops:
    build:
      context: ./ai-ops
      dockerfile: Dockerfile
    container_name: nexus-ai-ops
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # AI Intel — Python demand & inventory ML service
  # ---------------------------------------------------------------------------
  ai-intel:
    build:
      context: ./ai-intel
      dockerfile: Dockerfile
    container_name: nexus-ai-intel
    ports:
      - "5001:5001"
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Postgres Exporter — database metrics
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: nexus-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://nexus:${DB_PASSWORD:?DB_PASSWORD not set}@postgres:5432/nexus_oms?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Redis Exporter — cache metrics
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0-alpine
    container_name: nexus-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Kafka Exporter — broker & consumer lag metrics
  # ---------------------------------------------------------------------------
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: nexus-kafka-exporter
    command:
      - '--kafka.server=kafka:9092'
      - '--web.listen-address=:9308'
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_started
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Node Exporter — host system metrics (CPU, memory, disk, network)
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: nexus-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # cAdvisor — container-level metrics (CPU, memory, network per container)
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: nexus-cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Alertmanager — alert routing & notifications
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: nexus-alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Loki — centralized log storage & querying
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.2.1
    container_name: nexus-loki
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Promtail — log collection (ships Docker logs to Loki)
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.2.1
    container_name: nexus-promtail
    volumes:
      - ./monitoring/loki/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/tmp
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Prometheus — metrics scraping
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: nexus-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - ./monitoring/prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - postgres-exporter
      - redis-exporter
      - kafka-exporter
      - node-exporter
      - cadvisor
      - alertmanager
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Grafana — dashboards & alerting
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: nexus-grafana
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD not set}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - nexus-network

# -----------------------------------------------------------------------------
# Named volumes — data survives container restarts
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
  promtail-data:

# -----------------------------------------------------------------------------
# Network
# -----------------------------------------------------------------------------
networks:
  nexus-network:
    driver: bridge
