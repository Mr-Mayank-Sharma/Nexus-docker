# =============================================================================
# Nexus OMS — Lightweight Test Compose
# =============================================================================
# Runs only the 4 essential services: postgres, redis, backend, frontend.
# Excludes: Kafka (~1-2GB RAM), AI services, full monitoring stack.
#
# Usage on EC2:
#   docker compose -f docker-compose.test.yml up -d --build
#
# For full production stack, use docker-compose.yml instead.
# =============================================================================

name: nexus

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL (pgvector) — primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: nexus_oms
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_oms"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Redis — cache & sessions
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Backend — Spring Boot OMS API (Kafka disabled)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    ports:
      - "8080:8080"
    environment:
      # Database
      NEXUS_DB_URL: jdbc:postgresql://postgres:5432/nexus_oms
      NEXUS_DB_USERNAME: nexus
      NEXUS_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
      # Redis
      NEXUS_REDIS_HOST: redis
      NEXUS_REDIS_PORT: 6379
      # Kafka — DISABLED (no Kafka container in test mode)
      NEXUS_KAFKA_BOOTSTRAP: kafka:9092
      NEXUS_KAFKA_ENABLED: "false"
      NEXUS_KAFKA_LISTENER_AUTO_START: "false"
      # JWT
      NEXUS_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
      NEXUS_JWT_EXPIRATION_MS: ${NEXUS_JWT_EXPIRATION_MS:-900000}
      # Spring profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # CORS / frontend
      NEXUS_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173}
      NEXUS_FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # AI — disabled
      NEXUS_AI_ENABLED: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      NEXUS_AI_BASE_URL_OPS: http://ai-ops:5000
      NEXUS_AI_BASE_URL_INTEL: http://ai-intel:5001
      # Cache
      NEXUS_CACHE_ENABLED: ${NEXUS_CACHE_ENABLED:-true}
      # S3 — disabled (no minio in test mode)
      NEXUS_S3_ENABLED: "false"
      NEXUS_S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
      NEXUS_S3_REGION: ${S3_REGION:-us-east-1}
      NEXUS_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      NEXUS_S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      NEXUS_S3_BUCKET: ${S3_BUCKET:-nexus-shipping-labels}
      # Logging
      NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Frontend — React SPA served by nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - nexus-network

# -----------------------------------------------------------------------------
# Named volumes
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
  redis-data:

# -----------------------------------------------------------------------------
# Network
# -----------------------------------------------------------------------------
networks:
  nexus-network:
    driver: bridge
