# =============================================================================
# Nexus OMS — Prometheus alert rules
# =============================================================================
# All rules below use metrics that are guaranteed to exist from the exporters.

groups:
  # ---------------------------------------------------------------------------
  # Infrastructure alerts — service health
  # ---------------------------------------------------------------------------
  - name: nexus-infrastructure
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
          description: "{{ $labels.instance }} has been unreachable for over 1 minute."

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for 5 minutes (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 85% (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: DiskSpaceLow
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk usage is above 85% (current: {{ $value | printf \"%.1f\" }}%)."

  # ---------------------------------------------------------------------------
  # Backend alerts — JVM, HTTP, database pool
  # ---------------------------------------------------------------------------
  - name: nexus-backend
    interval: 30s
    rules:
      - alert: HighHTTPErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) * 100 > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx error rate above 5%"
          description: "Current error rate: {{ $value | printf \"%.2f\" }}%"

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 request latency above 2s"
          description: "Current P95 latency: {{ $value | printf \"%.3f\" }}s"

      - alert: JVMHeapHigh
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap usage above 85%"
          description: "Current heap usage: {{ $value | printf \"%.1f\" }}%"

      - alert: HikariCPConnectionPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP connection pool >80% utilized"
          description: "Current utilization: {{ $value | printf \"%.1f\" }}%"

  # ---------------------------------------------------------------------------
  # Database alerts — Postgres
  # ---------------------------------------------------------------------------
  - name: nexus-database
    interval: 30s
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is DOWN"

      - alert: PostgresHighConnections
        expr: sum(pg_stat_activity_count) / on() pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection count above 80%"
          description: "Current utilization: {{ $value | printf \"%.1f\" }}%"

      - alert: PostgresSlowQueries
        expr: avg(pg_stat_activity_max_tx_duration{state="active"}) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Long-running Postgres queries detected"
          description: "Average active transaction duration: {{ $value | printf \"%.0f\" }}s"

  # ---------------------------------------------------------------------------
  # Redis alerts
  # ---------------------------------------------------------------------------
  - name: nexus-redis
    interval: 30s
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN"

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage above 80%"
          description: "Current usage: {{ $value | printf \"%.1f\" }}%"

      - alert: RedisHighEvictionRate
        expr: rate(redis_evicted_keys_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Redis key eviction rate"
          description: "{{ $value | printf \"%.0f\" }} keys/sec being evicted"

  # ---------------------------------------------------------------------------
  # Container alerts — cAdvisor
  # ---------------------------------------------------------------------------
  - name: nexus-containers
    interval: 30s
    rules:
      - alert: ContainerHighCPU
        expr: sum(rate(container_cpu_usage_seconds_total{name!=""}[5m])) by (name) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high CPU"
          description: "CPU usage: {{ $value | printf \"%.1f\" }}%"

      - alert: ContainerHighMemory
        expr: container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!="", container_spec_memory_limit_bytes!="0"} * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high memory"
          description: "Memory usage: {{ $value | printf \"%.1f\" }}% of limit"
