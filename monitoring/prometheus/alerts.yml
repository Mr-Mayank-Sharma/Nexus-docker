# =============================================================================
# Nexus OMS — Prometheus alert rules
# =============================================================================
#
# NOTE: These rules reference metrics that are only available once the
# corresponding scrape targets are enabled (see prometheus.yml). The backend
# HTTP metrics (http_server_requests_*), inventory/integration custom metrics,
# and Kafka consumer lag require either the backend prometheus endpoint to be
# exposed (with auth) or dedicated exporters to be added.
#
# The rules are kept here as ready-to-use templates. Enable them by:
#   1. Adding the scrape targets in prometheus.yml, and
#   2. Uncommenting the corresponding rules below.
# =============================================================================

groups:
  - name: nexus-oms-alerts
    interval: 30s
    rules:
      # Backend is down (works for any active scrape target)
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"

