# ── Production profile overrides ─────────────────────────────────────────────
# Activated with SPRING_PROFILES_ACTIVE=prod. Base config lives in application.properties.
# Secrets must come from environment variables / a secrets manager — never hardcode here.

# Hardened DB pool for production traffic
spring.datasource.hikari.maximum-pool-size=${NEXUS_DB_POOL_MAX:30}
spring.datasource.hikari.minimum-idle=${NEXUS_DB_POOL_MIN:10}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=60000

# Never let Hibernate touch the schema in prod
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway: fail fast on out-of-order/summary mismatches
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Containers: graceful shutdown, no lazy-init surprises
spring.main.lazy-initialization=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Only safe actuator endpoints exposed; no detailed error bodies
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never

# CORS locked to explicitly allowed origins
app.cors.allowed-origins=${NEXUS_CORS_ORIGINS:https://app.nexusship.example.com}
app.frontend-url=${NEXUS_FRONTEND_URL:https://app.nexusship.example.com}

# Tuned logging for prod (structured JSON via logback profile, INFO level)
logging.level.root=${NEXUS_LOG_LEVEL:INFO}
logging.level.com.nexus.oms=INFO

# Session / auth hardening
app.jwt.expiration-ms=${NEXUS_JWT_EXPIRATION_MS:900000}

# Cache: enable Redis-backed caching in prod (must run redis)
nexus.cache.enabled=${NEXUS_CACHE_ENABLED:true}
spring.cache.type=${SPRING_CACHE_TYPE:redis}

# SECURITY: no anonymous sign-ups in production — admins provision users
app.registration.enabled=false
