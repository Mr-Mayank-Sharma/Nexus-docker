server.port=8080
server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:postgresql://localhost:5432/nexus_oms_dev
spring.datasource.username=nexus
spring.datasource.password=nexus
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

spring.cache.type=none

spring.flyway.enabled=false

spring.kafka.consumer.group-id=nexus-oms-dev
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.jwt.secret=DevModeJwtSecretKeyThatIsAtLeast32CharactersLong!!
app.jwt.expiration-ms=86400000

# DEV ONLY - restrict to specific origins in production
app.cors.allowed-origins=*

storage.s3.endpoint=http://localhost:9000
storage.s3.region=us-east-1
storage.s3.access-key=testaccesskey
storage.s3.secret-key=testsecretkey
storage.s3.bucket=dev-bucket

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=false
management.health.kafka.enabled=false

logging.level.com.nexus=DEBUG

# Allow anonymous self-registration only in dev
app.registration.enabled=true
